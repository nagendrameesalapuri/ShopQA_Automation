name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Check test environment
        run: curl --fail --silent --show-error --head https://nagendra-shopqa.netlify.app

      - name: Validate CI credentials
        shell: bash
        env:
          USERNAME_CUSTOMER: ${{ secrets.USERNAME_CUSTOMER }}
          PASSWORD_CUSTOMER: ${{ secrets.PASSWORD_CUSTOMER }}
          USERNAME_ADMIN: ${{ secrets.USERNAME_ADMIN }}
          PASSWORD_ADMIN: ${{ secrets.PASSWORD_ADMIN }}
        run: |
          missing=0
          for name in USERNAME_CUSTOMER PASSWORD_CUSTOMER USERNAME_ADMIN PASSWORD_ADMIN; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the required repository secrets before running Playwright tests."
            exit 1
          fi

      - name: Run tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          ENV: dev
          CI: true
          HEADLESS: true
          USERNAME_CUSTOMER: ${{ secrets.USERNAME_CUSTOMER }}
          PASSWORD_CUSTOMER: ${{ secrets.PASSWORD_CUSTOMER }}
          USERNAME_ADMIN: ${{ secrets.USERNAME_ADMIN }}
          PASSWORD_ADMIN: ${{ secrets.PASSWORD_ADMIN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30

      - name: Upload automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ matrix.browser }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
